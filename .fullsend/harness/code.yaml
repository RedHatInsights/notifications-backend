# Enables GitHub signed commits (see docs/code.md "Signed commits").
#
# Overrides the trigger upstream now ships by default (as of this pin) to
# add repo-label scoping: upstream's own trigger already matches Jira
# ready-to-code/`/fs-code` events, but with no `repo:` label check, so
# without this override every repo polling the same Jira project would
# dispatch on the same issue.
base: https://raw.githubusercontent.com/fullsend-ai/agents/87a43fcb849546b267a619434ca19dedde8df476/harness/code.yaml#sha256=8973a15fe53798c632d86c6d2e595a476bfb7cd2f9392961b63533e30d4f1e15
env:
  runner:
    GITHUB_SIGNED_COMMITS: "true"
trigger: >
    has(event.source) && event.source.system == "jira"
    && event.entity.kind == "work_item"
    && !has(event.entity.linked_change_proposal)
    && "repo:RedHatInsights/notifications-backend" in event.state.labels
    && event.state.labels.filter(label, label.startsWith("repo:")).size() == 1
    && event.actor.kind == "human"
    && (
         (event.transition.kind == "label_changed"
           && event.transition.label.action == "added"
           && event.transition.label.name == "ready-to-code")
         ||
         (event.transition.kind == "comment_added"
           && has(event.transition.comment.command)
           && event.transition.comment.command == "/fs-code")
       )
