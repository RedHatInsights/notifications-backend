# Narrows the (already forge-neutral) upstream trigger to Jira issues
# carrying exactly this repo's `repo:` label, so a mislabeled issue can't
# get dispatched by more than one repo's poller. Has no effect on GitHub
# dispatch, which doesn't read this field (fullsend-ai/fullsend#2264:
# Jira-sourced dispatches currently fail right after pickup regardless).
#
# The overlay disables TRIAGE_AUTO_CODE for Jira-sourced runs only, so a
# Jira issue needs an explicit "ready-to-code" label/`/fs-code` comment
# before code runs, instead of auto-escalating as it does on GitHub.
base: https://raw.githubusercontent.com/fullsend-ai/agents/f9908adce062d7e0a37635aac4b6c889835476cc/harness/triage.yaml#sha256=32f09d8824e84f0578dd499ff4601c2079e24e9a9d6b57ec72f4b26eb4a59831
trigger: >
    has(event.source) && event.source.system == "jira"
    && event.entity.kind == "work_item"
    && "repo:RedHatInsights/notifications-backend" in event.state.labels
    && event.state.labels.filter(label, label.startsWith("repo:")).size() == 1
    && (
         (event.transition.kind == "label_changed"
           && event.transition.label.action == "added"
           && event.transition.label.name == "ready-for-triage")
         ||
         (event.transition.kind == "comment_added"
           && has(event.transition.comment.command)
           && event.transition.comment.command == "/fs-triage")
       )
overlays:
    - when: 'has(event.source) && event.source.system == "jira"'
      env:
          runner:
              TRIAGE_AUTO_CODE: "off"
              TRIAGE_AUTO_CODE_CATEGORIES: ""
          sandbox:
              TRIAGE_AUTO_CODE: "off"
              TRIAGE_AUTO_CODE_CATEGORIES: ""
