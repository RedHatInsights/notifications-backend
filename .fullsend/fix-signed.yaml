# Enables the GitHub Git Data API signed-commit publish path (fullsend
# v0.51.0+; off by default upstream). See "Signed commits" in the
# fullsend-ai/agents repo's docs/code.md. This is the documented per-repo
# override mechanism ("Override per repo via base: composition" in
# harness/fix.yaml) -- not a temporary test shim.
base: https://raw.githubusercontent.com/fullsend-ai/agents/f9908adce062d7e0a37635aac4b6c889835476cc/harness/fix.yaml#sha256=a95756c587fa62c88869f32cc788e6dc461870dc885c36fa91b618ff0f30247f
env:
  runner:
    GITHUB_SIGNED_COMMITS: "true"
