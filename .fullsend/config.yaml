version: "1"
runtime: pi
roles:
    - triage
    - coder
    - review
    - fix
agents:
    - name: triage
      source: harness/triage.yaml
      model: google-vertex/gemini-3.8-flash
    - name: code
      source: harness/code.yaml
      model: google-vertex/gemini-3.8-flash
    - name: review
      model: google-vertex/gemini-3.8-flash
      trigger: |-
        (event.entity.kind == "change_proposal"
          && event.transition.kind == "label_changed"
          && event.transition.label.name == "ready-for-review"
          && event.transition.label.action == "added")
        || (event.transition.kind == "comment_added"
          && has(event.transition.comment.command)
          && event.transition.comment.command == "/fs-review"
          && event.actor.kind == "human"
          && (event.entity.kind == "change_proposal"
              || has(event.entity.linked_change_proposal)))
    - name: fix
      source: harness/fix.yaml
      model: google-vertex/gemini-3.8-flash
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
